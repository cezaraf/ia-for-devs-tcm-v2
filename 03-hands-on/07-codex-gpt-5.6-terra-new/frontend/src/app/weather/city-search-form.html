<form (ngSubmit)="submit()"><label for="city-input">cidade</label><div class="controls"><input id="city-input" name="city" [(ngModel)]="value" [disabled]="disabled()" autocomplete="off"><button class="primary" type="submit" [disabled]="disabled()">buscar</button>@if (locationAvailable()) { <button class="secondary" type="button" (click)="locate.emit()" [disabled]="disabled()">[usar minha localização]</button> }</div></form>

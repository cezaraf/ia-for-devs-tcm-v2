<main [attr.data-theme]="theme()"><div class="container"><h1>[clima]</h1><app-city-search-form [disabled]="busy()" [locationAvailable]="locationAvailable" (search)="search($event)" (locate)="getLocation(true)"/><section class="result" aria-live="polite" [attr.aria-busy]="busy()">@if(state()==='idle'){<p class="idle">digite uma cidade para ver o clima atual</p>}@else if(state()==='searching'||state()==='loading'){<app-weather-card-skeleton/>}@else if(state()==='choosing'){<app-city-list [cities]="cities()" (selected)="choose($event)"/>}@else if(state()==='success'&&weather()){<app-weather-card [weather]="weather()!" [city]="selected()" [location]="location()"/>}@else if(state()==='error'){<app-error-message [message]="message()" [retryable]="retryable()" (retry)="retry()"/>}</section></div></main>

<div class="card" aria-hidden="true">
  <div class="head">
    <span class="label"><span class="block">&nbsp;</span></span>
    <span class="badge"><span class="block">[ NOITE ]</span></span>
  </div>
  <p class="temperature"><span class="block">00°C</span></p>
  <p class="condition"><span class="block">Predominantemente limpo</span></p>
  <ul class="details">
    @for (row of rows; track row) {
      <li class="detail"><span class="block">&nbsp;</span></li>
    }
  </ul>
  <p class="footer"><span class="block">medido às 00:00 (hora local)</span></p>
</div>

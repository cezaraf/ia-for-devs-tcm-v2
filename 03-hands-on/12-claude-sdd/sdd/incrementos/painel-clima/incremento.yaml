  review: obrigatoria
  pr_merge: obrigatoria
  deploy: dispensada
  justificativas_de_dispensa:
    - "deploy: alvo branch; execução apenas no ambiente de desenvolvimento (compose.yaml, PRM-008), sem produção."
    - "passo 05: não incluído por padrão; recomendado antes do 04 para instalar sdd/governanca (PRM-006)."
  etapas: "00 → 01 → 02 → 03 → 04 → 06 → 07 → 08 → 10 → 11 → 13 → 14"


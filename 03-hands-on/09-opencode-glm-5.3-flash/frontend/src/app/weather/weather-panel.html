<main class="container">
  <h1 class="title">[clima]</h1>
  <app-city-search-form [busy]="busy()" (search)="onSearch($event)" (locate)="onLocate()" />
  <div class="result" aria-live="polite" [attr.aria-busy]="busy() ? 'true' : null">
    @switch (state()) {
      @case ('idle') {
        <p class="hint">digite uma cidade para ver o clima atual</p>
      }
      @case ('searching') {
        <app-weather-card-skeleton />
      }
      @case ('choosing') {
        <app-city-list [cities]="cities()" (select)="onSelect($event)" />
      }
      @case ('loading') {
        <app-weather-card-skeleton />
      }
      @case ('success') {
        @if (weather(); as current) {
          <app-weather-card [weather]="current" [label]="placeLabel()" />
        }
      }
      @case ('error') {
        @if (error(); as panelError) {
          <app-error-message
            [message]="panelError.message"
            [retryable]="panelError.retryable"
            (retry)="onRetry()"
          />
        }
      }
    }
  </div>
</main>

<div class="page" [attr.data-theme]="theme()">
  <main class="container">
    <h1 class="title">[clima]</h1>
    <app-city-search-form
      [busy]="busy()"
      [geolocationAvailable]="geolocationAvailable()"
      (citySearch)="onSearch($event)"
      (locate)="locate()"
    />
    <section class="result" aria-live="polite" [attr.aria-busy]="busy()">
      @switch (state()) {
        @case ('idle') {
          <p class="idle">digite uma cidade para ver o clima atual</p>
        }
        @case ('searching') {
          <app-weather-card-skeleton />
        }
        @case ('loading') {
          <app-weather-card-skeleton />
        }
        @case ('choosing') {
          <app-city-list [cities]="cities()" (selected)="onSelect($event)" />
        }
        @case ('success') {
          @if (weather(); as w) {
            <app-weather-card [weather]="w" [label]="locationLabel()" />
          }
        }
        @case ('error') {
          @if (error(); as e) {
            <app-error-message [message]="e.message" [retryable]="e.retryable" (retry)="retry()" />
          }
        }
      }
    </section>
  </main>
</div>

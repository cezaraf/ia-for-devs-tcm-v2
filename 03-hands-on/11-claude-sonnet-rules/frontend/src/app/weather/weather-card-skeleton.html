<div class="card" aria-hidden="true">
  <div class="head">
    <span class="label block">&nbsp;</span>
    <span class="badge block">&nbsp;</span>
  </div>
  <p class="temperature block">&nbsp;</p>
  <p class="condition block">&nbsp;</p>
  <div class="details">
    @for (i of rows; track i) {
      <p class="detail"><span class="block">&nbsp;</span></p>
    }
  </div>
  <p class="footer block">&nbsp;</p>
</div>
